<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Security check</title>
    <script>
        var primary = (navigator.languages && navigator.languages[0]) || navigator.language || "";
        var zh = String(primary).toLowerCase().indexOf("zh") === 0;
        document.documentElement.lang = zh ? "zh" : "en";
        document.title = zh ? "人机验证" : "Security check";
    </script>
    <style>
        * { box-sizing: border-box; }
        html:not([lang="zh"]) [lang="zh"] { display: none; }
        html[lang="zh"] [lang="en"] { display: none; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px 16px;
            background: #fff;
            color: #111;
            font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        }
        #captchaContainer {
            width: max-content;
            max-width: 100%;
        }
        h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.03em;
        }
        #captchaTip {
            margin: 6px 0 14px;
            font-size: 14px;
            color: #555;
        }
        #captchaImage {
            position: relative;
            margin: 0 auto;
            overflow: hidden;
            background-color: #f2f2f2;
            background-size: cover;
            border: 1px solid #d8d8d8;
            user-select: none;
        }
        #captchaPiece {
            position: absolute;
            top: 0;
            left: 0;
            background-size: cover;
            cursor: grab;
            touch-action: none;
            user-select: none;
        }
        #captchaPiece:active { cursor: grabbing; }
        #captchaMessage {
            margin: 10px 0 0;
            font-size: 13px;
            line-height: 1.4;
            color: #b42318;
        }
        #captchaMessage:empty { display: none; }
        #captchaSubmit {
            display: block;
            width: 100%;
            height: 40px;
            margin-top: 14px;
            border: 0;
            background: #111;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
        }
        #captchaSubmit:hover { background: #000; }
        #captchaSubmit:disabled { opacity: 0.45; cursor: default; }
        small {
            margin-top: 18px;
            font-size: 12px;
            letter-spacing: 0.04em;
            color: #8a8a8a;
        }
    </style>
</head>
<body>
    <div id="captchaContainer">
        <h1>
            <span lang="en">Security check</span>
            <span lang="zh">人机验证</span>
        </h1>
        <div id="captchaTip">
            <span lang="en">Drag the piece into the gap.</span>
            <span lang="zh">把拼图拖到缺口处。</span>
        </div>
        <div id="captchaImage">
            <div id="captchaPiece"></div>
        </div>
        <div id="captchaMessage">{{message}}</div>
        <button id="captchaSubmit" type="button">
            <span lang="en">Continue</span>
            <span lang="zh">提交验证</span>
        </button>
    </div>
    <small>WAFCDN</small>

    <script>
        const container = document.getElementById("captchaContainer");
        const captchaImage = container.querySelector("#captchaImage");
        const captchaPiece = container.querySelector("#captchaPiece");

        let dragging = false;
        let offsetX = 0;
        let offsetY = 0;

        let formX = 0
        let formY = 0
        let formId = "{{id}}"

        function startDrag(e) {
            dragging = true;
            const point = e.touches ? e.touches[0] : e;
            const rect = captchaPiece.getBoundingClientRect();
            offsetX = point.clientX - rect.left;
            offsetY = point.clientY - rect.top;
        }

        function moveDrag(e) {
            if (!dragging) return;
            const point = e.touches ? e.touches[0] : e;
            const rect = captchaImage.getBoundingClientRect();

            let x = point.clientX - rect.left - offsetX;
            let y = point.clientY - rect.top - offsetY;

            formX = x = Math.ceil(Math.max(0, Math.min(rect.width - captchaPiece.offsetWidth, x)));
            formY = y = Math.ceil(Math.max(0, Math.min(rect.height - captchaPiece.offsetHeight, y)));

            captchaPiece.style.left = x + "px";
            captchaPiece.style.top = y + "px";
        }

        function endDrag() {
            dragging = false;
        }

        captchaPiece.addEventListener("mousedown", startDrag);
        document.addEventListener("mousemove", moveDrag);
        document.addEventListener("mouseup", endDrag);

        captchaPiece.addEventListener("touchstart", startDrag, { passive: false });
        document.addEventListener("touchmove", moveDrag, { passive: false });
        document.addEventListener("touchend", endDrag);

        captchaImage.style.backgroundImage = `url('{{imageBase64}}')`;
        captchaImage.style.width = '{{imageWidth}}px';
        captchaImage.style.height = '{{imageHeight}}px';

        captchaPiece.style.backgroundImage = `url('{{pieceBase64}}')`;
        captchaPiece.style.width = '{{pieceWidth}}px';
        captchaPiece.style.height = '{{pieceHeight}}px';

        captchaSubmitButton = document.getElementById("captchaSubmit")
        function captchaSubmit() {
            captchaSubmitButton.disabled = true;
            let form = document.createElement("form");
            form.method = "POST";
            [["id", formId], ["x", formX], ["y", formY]].forEach(([k, v]) => {
                let i = document.createElement("input");
                i.type = "hidden"; i.name = k; i.value = v;
                form.appendChild(i);
            });
            document.body.appendChild(form);
            form.submit();
        }
        captchaSubmitButton.onclick = captchaSubmit;
    </script>
</body>
</html>
